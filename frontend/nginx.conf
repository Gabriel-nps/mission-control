server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A API roda na mesma origem via proxy, o que dispensa CORS e permite
    # que a imagem do frontend nao carregue nenhum host fixo.
    location ~ ^/(auth|missions|docs|openapi.json) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota desconhecida cai no index.html para o router do Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
